<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Create Group - BillWise</title>
</head>

<body>

    <h1>Create a new group</h1>

    <form th:action="@{/groups}" th:object="${groupRequest}" method="post">

        <div>
            <label for="name">Group name</label>
            <input id="name" type="text" th:field="*{name}">

            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                Name error
            </p>
        </div>

        <div>
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}">
            </textarea>

            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                Description error
            </p>
        </div>

        <div>
            <label for="baseCurrency">Base currency</label>
            <input id="baseCurrency" type="text" th:field="*{baseCurrency}">

            <p th:if="${#fields.hasErrors('baseCurrency')}" th:errors="*{baseCurrency}">
                Currency error
            </p>
        </div>

        <button type="submit">Create group</button>
    </form>

    <p>
        <a th:href="@{/groups}">Cancel</a>
    </p>

</body>

</html>
