<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Expense form; participants are rendered from the current group's members. -->

<head>
    <meta charset="UTF-8">
    <title>Add Expense - BillWise</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <h1>Add expense</h1>

    <p>
        Group:
        <strong th:text="${group.name}">
            Group name
        </strong>
    </p>

    <form th:action="@{/groups/{id}/expenses(id=${group.id})}" th:object="${expenseRequest}" method="post">

        <div>
            <label for="description">Description</label>

            <input id="description" type="text" th:field="*{description}" required>

            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                Description error
            </p>
        </div>

        <div>
            <label for="amount">Amount</label>

            <input id="amount" type="number" step="0.01" th:field="*{amount}" required>

            <p th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">
                Amount error
            </p>
        </div>

        <div>
            <label for="currency">Currency</label>

            <input id="currency" type="text" th:field="*{currency}" required>

            <p th:if="${#fields.hasErrors('currency')}" th:errors="*{currency}">
                Currency is required
            </p>
        </div>

        <div>
            <label for="expenseDate">Date</label>

            <input id="expenseDate" type="date" th:field="*{expenseDate}" required>

            <p th:if="${#fields.hasErrors('expenseDate')}" th:errors="*{expenseDate}">
                Expense date is required
            </p>
        </div>

        <div>
            <label for="payerUsernameOrEmail">
                Paid by
            </label>

            <select id="payerUsernameOrEmail" th:field="*{payerUsernameOrEmail}">

                <option th:each="member : ${members}" th:value="${member.username}" th:text="${member.username}">
                    Username
                </option>
            </select>
        </div>

        <div>
            <p class="field-label">Category</p>

            <select th:field="*{category}" required>
                <option value="FOOD">Food</option>
                <option value="TRANSPORT">Transport</option>
                <option value="HOUSING">Housing</option>
                <option value="SHOPPING">Shopping</option>
                <option value="ENTERTAINMENT">
                    Entertainment
                </option>
                <option value="OTHER">Other</option>
            </select>

            <p th:if="${#fields.hasErrors('category')}" th:errors="*{category}">
                Category is required
            </p>
        </div>

        <div>
            <p class="field-label">Participants</p>

            <p
                th:if="${#fields.hasErrors('participantUsernamesOrEmails')}"
                th:errors="*{participantUsernamesOrEmails}">
                Select at least one participant
            </p>

            <label class="participant-option" th:each="member : ${members}">
                <input type="checkbox" th:field="*{participantUsernamesOrEmails}" th:value="${member.username}">

                <span th:text="${member.username}">
                    Username
                </span>
            </label>
        </div>

        <button type="submit">Save expense</button>
    </form>

    <p>
        <a th:href="@{/groups/{id}(id=${group.id})}">
            Cancel
        </a>
    </p>

</body>

</html>
