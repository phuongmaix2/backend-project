<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | BillWise</title>
</head>

<body>
    <header>
        <h1>BillWise Dashboard</h1>

        <form th:action="@{/logout}" method="post">
            <button type="submit">Log out</button>
        </form>
    </header>

    <main>
        <h2>
            Welcome,
            <span th:text="${username}">user</span>!
        </h2>

        <p>
            Manage your shared expenses and groups here.
        </p>

        <section>
            <h2>My groups</h2>

            <p>
                <a th:href="@{/groups/new}">Create a new group</a>
            </p>

            <p th:if="${#lists.isEmpty(groups)}">
                You do not have any groups yet.
            </p>

            <div th:each="group : ${groups}">
                <h3 th:text="${group.name}">Group name</h3>

                <p th:text="${group.description}">
                    Group description
                </p>

                <p>
                    Currency:
                    <span th:text="${group.baseCurrency}">EUR</span>
                </p>

                <a th:href="@{/groups/{id}(id=${group.id})}">
                    View group details
                </a>

                <hr>
            </div>
        </section>
    </main>
</body>

</html>
