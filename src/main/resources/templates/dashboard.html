<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | BillWise</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <header class="topbar">
        <h1>BillWise</h1>

        <form th:action="@{/logout}" method="post">
            <button class="button-secondary" type="submit">Log out</button>
        </form>
    </header>

    <main class="page-shell">
        <h2>
            Welcome,
            <span th:text="${username}">user</span>!
        </h2>

        <p>
            Manage your shared expenses and groups here.
        </p>

        <section class="content-section">
            <div class="section-title-row">
                <h2>My groups</h2>

                <a class="button" th:href="@{/groups/new}">
                    + Create group
                </a>
            </div>

            <p th:if="${#lists.isEmpty(groups)}">
                You do not have any groups yet.
            </p>

            <div class="simple-card" th:each="group : ${groups}">
                <h3 th:text="${group.name}">Group name</h3>

                <p th:text="${group.description}">
                    Group description
                </p>

                <p>
                    Currency:
                    <span th:text="${group.baseCurrency}">EUR</span>
                </p>

                <a th:href="@{/groups/{id}(id=${group.id})}">
                    View group details
                </a>

            </div>
        </section>
    </main>
</body>

</html>
